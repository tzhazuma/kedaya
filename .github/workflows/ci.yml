name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------
  # 共享契约层：设计令牌生成 + 类型检查 + 测试
  # 这是客户端与 API 的地基
  # ------------------------------------------------------------------
  contracts:
    name: 契约层（tokens / contracts / shared）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成设计令牌并确认产物是最新的
        run: |
          npm run tokens
          if ! git diff --exit-code -- packages/design-tokens/src packages/design-tokens/dist; then
            echo "::error::设计令牌产物与 tokens.json 不一致。请在本地运行 'npm run tokens' 并提交生成结果。"
            exit 1
          fi

      - name: 类型检查
        run: |
          npm run typecheck -w @kedaya/design-tokens
          npm run typecheck -w @kedaya/contracts
          npm run typecheck -w @kedaya/shared

      - name: 测试
        run: |
          npm run test -w @kedaya/contracts
          npm run test -w @kedaya/shared

  # ------------------------------------------------------------------
  # 各端
  # ------------------------------------------------------------------
  web:
    name: Web（Next.js）
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - name: 类型检查
        run: npm run typecheck -w @kedaya/web
      - name: 测试
        run: npm run test -w @kedaya/web
      - name: 构建
        run: npm run build -w @kedaya/web

  miniapp:
    name: 微信小程序（Taro）
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - name: 类型检查
        run: npm run typecheck -w @kedaya/miniapp
      - name: 测试
        run: npm run test -w @kedaya/miniapp
      - name: 构建 weapp
        run: npm run build:weapp -w @kedaya/miniapp

      # 小程序没有“安装包”：产物需要导入微信开发者工具再上传。
      # 这里把 dist 打成 zip 供下载，并保留 14 天。
      - name: 打包小程序产物
        run: |
          test -d apps/miniapp/dist
          cd apps/miniapp
          zip -qr kedaya-miniapp-weapp.zip dist
          ls -lh kedaya-miniapp-weapp.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-miniapp-weapp
          path: apps/miniapp/kedaya-miniapp-weapp.zip
          retention-days: 14
          if-no-files-found: error

  api:
    name: 后端（NestJS）
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - name: 类型检查
        run: npm run typecheck -w @kedaya/api
      - name: 测试
        shell: bash
        # PGlite（PostgreSQL 的 WASM 构建）在 Linux 上偶发
        # `Connection terminated unexpectedly`（2026-11-28 实测：同一文件连跑三次，
        # 第一次失败、后两次通过）。实例是 describe 级共享的，vitest 的用例级
        # retry 重建不了连接，因此整体重跑失败的文件。
        # 前提两条同时满足：失败文件**全部**是 PGlite 真库 spec，且日志里确有该错误。
        # 其它任何失败都直接判红，不被重跑掩盖。
        run: |
          LOG=$(mktemp)
          set +e
          npm run test -w @kedaya/api 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then exit 0; fi
          if ! grep -qE 'Connection terminated unexpectedly' "$LOG"; then
            echo '失败不是已知的 PGlite 偶发断连，不做重跑'
            exit "$STATUS"
          fi
          FAILED=$(grep -E 'FAIL' "$LOG" \
            | grep -oE '(test|src)/[A-Za-z0-9_./-]+\.spec\.ts' | sort -u)
          if [ -z "$FAILED" ]; then
            echo '没能定位失败的 spec 文件，不做重跑'
            exit "$STATUS"
          fi
          echo "失败文件：$FAILED"
          for f in $FAILED; do
            if ! grep -q 'createPglitePrisma' "services/api/$f"; then
              echo "$f 不是 PGlite 真库用例，不做重跑"
              exit "$STATUS"
            fi
          done
          echo '仅 PGlite 真库用例偶发断连，整体重跑失败文件'
          # shellcheck disable=SC2086
          npm run test -w @kedaya/api -- $FAILED
      - name: 构建
        run: npm run build -w @kedaya/api

  # ------------------------------------------------------------------
  # 仓库卫生
  # ------------------------------------------------------------------
  hygiene:
    name: 仓库卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否误提交了密钥/环境文件
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$' || true)
          if [ -n "$bad" ]; then
            echo "::error::不应提交 .env 文件: $bad"
            exit 1
          fi
      - name: 检查是否误提交了第三方角色素材
        run: |
          if git ls-files | grep -iE 'pokemon|psyduck|nintendo' ; then
            echo "::error::不得提交第三方角色素材（见 docs/adr/0005-brand-and-ip.md）"
            exit 1
          fi
          echo "OK: 未发现第三方角色素材"
