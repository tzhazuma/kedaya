name: Mobile Build (Flutter)

# 只允许手动触发或 mobile-v* tag 触发；不随 main 的每次 push 跑。
# 产物全部通过 actions/upload-artifact 保存；Release 必须显式 publish_release
# 或推 mobile-v* tag（见 release job）。
# Runner 明确 pin：macOS = macos-15（macos-14 已于 2026-11-02 退役），
# Windows x64 = windows-2022（windows-latest 现在是 VS 2026 镜像，而 Flutter
# 3.35.1 只识别 VS major 17）。quality job 跑 flutter analyze / flutter test。
# 文档在 docs/build/：根 .gitignore 的 build/ 规则会忽略它，提交时需
# `git add -f docs/build`（详见 docs/build/README.md）。
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "构建 Android APK（release 构建，但当前 Gradle 用 debug 签名）"
        type: boolean
        default: true
      build_windows_x64:
        description: "构建 Windows x64 便携包 + Inno Setup 安装器"
        type: boolean
        default: true
      build_linux_x64:
        description: "构建 Linux x64 tar.gz + deb"
        type: boolean
        default: true
      build_linux_arm64:
        description: "构建 Linux arm64 tar.gz + deb（x64 主机交叉编译 + qemu 跑 AOT）"
        type: boolean
        default: true
      build_macos:
        description: "构建 macOS arm64 未签名 zip/dmg（macOS runner，计费较高）"
        type: boolean
        default: true
      build_ios:
        description: "构建 iOS 未签名 Runner.app zip（macOS runner，计费较高）"
        type: boolean
        default: true
      publish_release:
        description: "创建/更新 GitHub Release（手动触发时生效；tag 推送会自动发布）"
        type: boolean
        default: false
      prerelease:
        description: "Release 标记为 pre-release（在当前签名状态下建议保持 true）"
        type: boolean
        default: true
      release_tag:
        description: "手动发布使用的 tag，例如 mobile-v0.1.0；tag 推送时忽略"
        type: string
        default: ""
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 apps/mobile/.metadata（revision 20f8274…）和 README 记录的 Flutter 3.35.1 对齐。
  FLUTTER_VERSION: "3.35.1"
  # 未配置仓库变量时默认 mock：产物开箱可看 UI，不指向占位域名。
  KEDAYA_FLAVOR: ${{ vars.KEDAYA_FLAVOR || 'mock' }}
  KEDAYA_API_BASE_URL: ${{ vars.KEDAYA_API_BASE_URL || 'https://api.kedaya.local' }}
  # 校园卡绑定码交换的共享密钥。未配置时为空，客户端据此把「绑定」入口显示成
  # 「本构建未启用」——不会出现一个注定超时的按钮。配了这个 secret 再出包，
  # 产物里才带可用的校园卡绑定。
  KEDAYA_ECARD_BIND_TOKEN: ${{ secrets.KEDAYA_ECARD_BIND_TOKEN }}

jobs:
  # ------------------------------------------------------------------
  # 质量门禁：不依赖原生工具链，先跑 analyze/test 再谈构建。
  # 既有 token 镜像 hash 断言已与 tokens.json 对齐（见 apps/mobile/README.md）；
  # 若这里红，先修测试或明确记录，不允许靠跳过门禁发布。
  # ------------------------------------------------------------------
  quality:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  # ------------------------------------------------------------------
  # Android：universal APK
  # 注意：android/app/build.gradle.kts 的 release 仍使用 debug signingConfig，
  # 因此产物只能用于内测/侧载，不能上架或当作正式发布包。
  # ------------------------------------------------------------------
  android:
    name: Android APK
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 计算版本号
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          [ -n "$version" ] || version="0.0.0"
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      # 只在目录缺失时生成；已有 android/ 时不碰，避免覆盖 Gradle 镜像/签名等改动。
      - name: 生成 Android 原生脚手架（仅缺失时）
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org cn.shanghaitech --project-name kedaya --no-pub .
          fi

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=KEDAYA_FLAVOR="$KEDAYA_FLAVOR" \
            --dart-define=KEDAYA_API_BASE_URL="$KEDAYA_API_BASE_URL" \
            --dart-define=KEDAYA_ECARD_BIND_TOKEN="$KEDAYA_ECARD_BIND_TOKEN"

      - name: 收集产物
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/artifacts/kedaya-${VERSION}-android-universal-debug-signed.apk"
          ls -lh build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-android-apk
          path: apps/mobile/build/artifacts/*.apk
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # Windows x64：便携 zip + Inno Setup 安装器
  # 产物未做 Authenticode 签名，SmartScreen 会提示未知发布者。
  # ------------------------------------------------------------------
  windows-x64:
    name: Windows x64（portable + setup）
    if: github.event_name == 'push' || inputs.build_windows_x64
    # windows-latest 现在指向 Windows Server 2025 + VS 2026（major 18）；
    # Flutter 3.35.1 的 visual_studio.dart 只把 major 17 映射为 VS 2022 生成器。
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Visual Studio 2022（Flutter 3.35.1 只识别 VS major 17）
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $version = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion | Select-Object -First 1)
          if (-not $version) { throw 'No Visual Studio installation with the C++ toolchain' }
          $major = [int]($version.Split('.')[0])
          Write-Host "Visual Studio installationVersion=$version (major=$major)"
          if ($major -ne 17) {
            throw "Flutter 3.35.1 only maps Visual Studio major 17 (VS 2022); found major $major. Pin windows-2022 or upgrade Flutter and adapt the generator mapping."
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 工具链检查（仅诊断）
        continue-on-error: true
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: 计算版本号
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw "pubspec.yaml is missing the version field" }
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^mobile-v',''
          }
          $version = $version -replace '[^0-9A-Za-z._-]','-'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER * 100 + [int]$env:GITHUB_RUN_ATTEMPT
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_NUMBER=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 生成 Windows 原生脚手架（仅缺失时）
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --org cn.shanghaitech --project-name kedaya --no-pub .
          }

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 Windows x64
        run: |
          flutter build windows --release `
            "--build-name=$env:VERSION" `
            "--build-number=$env:BUILD_NUMBER" `
            "--dart-define=KEDAYA_FLAVOR=$env:KEDAYA_FLAVOR" `
            "--dart-define=KEDAYA_API_BASE_URL=$env:KEDAYA_API_BASE_URL" `
            "--dart-define=KEDAYA_ECARD_BIND_TOKEN=$env:KEDAYA_ECARD_BIND_TOKEN"

      - name: 打包便携 zip 与 Inno Setup 安装器
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter kedaya.exe |
            Where-Object { $_.FullName -match '\\runner\\Release\\kedaya\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { throw "kedaya.exe not found under build/windows/**/runner/Release" }

          $releaseDir = $exe.Directory.FullName
          $repoRoot = (Resolve-Path ../..).Path
          New-Item -ItemType Directory -Force -Path build/artifacts | Out-Null
          Copy-Item -Force (Join-Path $repoRoot 'LICENSE') (Join-Path $releaseDir 'LICENSE')

          $zip = "build/artifacts/kedaya-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zip -Force

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is not installed; cannot build the installer' }
          }

          $mobileRoot = (Get-Location).Path
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$releaseDir" `
            "/DOutputDir=$mobileRoot\build\artifacts" `
            "/DIconFile=$mobileRoot\windows\runner\resources\app_icon.ico" `
            "$repoRoot\docs\build\windows\kedaya.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          Get-ChildItem build/artifacts | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-windows-x64
          path: |
            apps/mobile/build/artifacts/*.zip
            apps/mobile/build/artifacts/*.exe
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # Linux x64：tar.gz + deb
  # ------------------------------------------------------------------
  linux-x64:
    name: Linux x64（tar.gz + deb）
    if: github.event_name == 'push' || inputs.build_linux_x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev librsvg2-bin

      - name: 计算版本号
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          [ -n "$version" ] || version="0.0.0"
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: 生成 Linux 原生脚手架（仅缺失时）
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --org cn.shanghaitech --project-name kedaya --no-pub .
          fi

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 Linux x64
        run: |
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=KEDAYA_FLAVOR="$KEDAYA_FLAVOR" \
            --dart-define=KEDAYA_API_BASE_URL="$KEDAYA_API_BASE_URL" \
            --dart-define=KEDAYA_ECARD_BIND_TOKEN="$KEDAYA_ECARD_BIND_TOKEN"

      - name: 打包 tar.gz 与 deb
        run: |
          bundle="build/linux/x64/release/bundle"
          test -x "$bundle/kedaya"
          mkdir -p build/artifacts
          rm -rf "build/artifacts/kedaya-${VERSION}-linux-x64"
          cp -a "$bundle" "build/artifacts/kedaya-${VERSION}-linux-x64"
          tar -C build/artifacts -czf \
            "build/artifacts/kedaya-${VERSION}-linux-x64.tar.gz" \
            "kedaya-${VERSION}-linux-x64"
          bash "$GITHUB_WORKSPACE/docs/build/linux/package-deb.sh" \
            "$VERSION" "$PWD/$bundle" "$PWD/build/artifacts" amd64
          ls -lh build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-linux-x64
          path: |
            apps/mobile/build/artifacts/*.tar.gz
            apps/mobile/build/artifacts/*.deb
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # Linux ARM64：原生 arm64 托管 runner。
  # 官方仍不发布 Linux ARM64 的 Flutter SDK 归档（只有 x64），但
  # bin/internal/update_dart_sdk.sh 会按 `uname -m` 选择 dart-sdk-linux-arm64.zip；
  # 所以解包官方 SDK 后删掉 bin/cache，让它在 arm64 宿主上自举成原生工具链。
  # 这样不需要 multiarch / 交叉 sysroot，也不需要 qemu 跑 gen_snapshot。
  # ------------------------------------------------------------------
  linux-arm64:
    name: Linux arm64（原生 arm64 runner）
    if: github.event_name == 'push' || inputs.build_linux_arm64
    # ubuntu-24.04-arm 是 GitHub 公共仓库的 arm64 托管 runner（2025 起 GA）。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装宿主架构 Flutter（arm64 自举）
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3             -o /tmp/flutter.tar.xz             "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          # 归档里的 bin/cache 是 x64 Dart SDK；删掉后首次运行会按 aarch64 拉 arm64 版本。
          rm -rf "$HOME/flutter/bin/cache"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev             libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev             libgstreamer-plugins-base1.0-dev librsvg2-bin

      - name: 校验宿主与工具链架构
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          flutter --version
          test -x "$HOME/flutter/bin/cache/dart-sdk/bin/dart"
          file "$HOME/flutter/bin/cache/dart-sdk/bin/dart"
          file "$HOME/flutter/bin/cache/dart-sdk/bin/dart" | grep -q 'ARM aarch64' || {
            echo "::error::Dart SDK 不是 aarch64，自举失败"
            exit 1
          }
          flutter doctor -v || true

      - name: 计算版本号
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          [ -n "$version" ] || version="0.0.0"
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 Linux arm64
        run: |
          flutter build linux --release             --build-name="$VERSION"             --build-number="$BUILD_NUMBER"             --dart-define=KEDAYA_FLAVOR="$KEDAYA_FLAVOR"             --dart-define=KEDAYA_API_BASE_URL="$KEDAYA_API_BASE_URL"             --dart-define=KEDAYA_ECARD_BIND_TOKEN="$KEDAYA_ECARD_BIND_TOKEN"

      - name: 校验产物架构并打包 tar.gz 与 deb
        run: |
          bundle="build/linux/arm64/release/bundle"
          test -x "$bundle/kedaya"
          file "$bundle/kedaya"
          file "$bundle/kedaya" | grep -q 'ARM aarch64' || {
            echo "::error::产物不是 aarch64"
            exit 1
          }
          mkdir -p build/artifacts
          rm -rf "build/artifacts/kedaya-${VERSION}-linux-arm64"
          cp -a "$bundle" "build/artifacts/kedaya-${VERSION}-linux-arm64"
          tar -C build/artifacts -czf             "build/artifacts/kedaya-${VERSION}-linux-arm64.tar.gz"             "kedaya-${VERSION}-linux-arm64"
          bash "$GITHUB_WORKSPACE/docs/build/linux/package-deb.sh"             "$VERSION" "$PWD/$bundle" "$PWD/build/artifacts" arm64
          ls -lh build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-linux-arm64
          path: |
            apps/mobile/build/artifacts/*linux-arm64.tar.gz
            apps/mobile/build/artifacts/*_arm64.deb
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # macOS：arm64，ad-hoc 签名、未 notarize
  # ------------------------------------------------------------------
  macos:
    name: macOS arm64（unsigned）
    if: github.event_name == 'push' || inputs.build_macos
    # macos-14 已于 2026-11-02 退役；macos-15 是当前可用的 arm64 镜像，
    # 默认 Xcode 16.4（16.0–16.4 均在镜像里），匹配 Flutter 3.35.1 的 Xcode 16 基线。
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 选择 Flutter 3.35.1 支持的 Xcode 16.x
        shell: bash
        run: |
          set -euo pipefail
          # macos-15 当前默认 Xcode 16.4；Flutter 3.35.1 的验证基线是 Xcode 16.x。
          # 镜像未来若把默认值升到 26，这里显式切回已安装的 16.x。
          xcode_version="$(xcodebuild -version)"
          if ! printf '%s\n' "$xcode_version" | grep -q '^Xcode 16\.'; then
            candidate="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1 || true)"
            if [ -z "$candidate" ]; then
              echo "::error::macos-15 上没有 Xcode 16.x；Flutter 3.35.1 未验证 Xcode 26，请先升级 Flutter 或固定镜像。"
              exit 1
            fi
            sudo xcode-select -s "$candidate"
            xcode_version="$(xcodebuild -version)"
          fi
          printf '%s\n' "$xcode_version" | grep -q '^Xcode 16\.' || {
            echo "::error::当前 Xcode 不是 16.x，Flutter 3.35.1 构建未验证。"
            exit 1
          }
          flutter --version
          pod --version

      - name: 计算版本号
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          [ -n "$version" ] || version="0.0.0"
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: 生成 macOS 原生脚手架（仅缺失时）
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos --org cn.shanghaitech --project-name kedaya --no-pub .
          fi

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 macOS arm64
        run: |
          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=KEDAYA_FLAVOR="$KEDAYA_FLAVOR" \
            --dart-define=KEDAYA_API_BASE_URL="$KEDAYA_API_BASE_URL" \
            --dart-define=KEDAYA_ECARD_BIND_TOKEN="$KEDAYA_ECARD_BIND_TOKEN"

      - name: 打包 zip/dmg（ad-hoc 签名）
        run: |
          app="build/macos/Build/Products/Release/kedaya.app"
          test -d "$app"
          # ad-hoc 签名只保证本机可运行；没有 Developer ID / notarization，
          # 其他机器下载后仍会被 Gatekeeper 拦截。
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p build/artifacts
          ditto -c -k --keepParent "$app" \
            "build/artifacts/kedaya-${VERSION}-macos-arm64-unsigned.zip"
          hdiutil create -volname "Kedaya" -srcfolder "$app" -ov -format UDZO \
            "build/artifacts/kedaya-${VERSION}-macos-arm64-unsigned.dmg"
          ls -lh build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-macos-arm64
          path: |
            apps/mobile/build/artifacts/*.zip
            apps/mobile/build/artifacts/*.dmg
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # iOS：未签名 Runner.app（不是 ipa）
  # ------------------------------------------------------------------
  ios:
    name: iOS unsigned（Runner.app）
    if: github.event_name == 'push' || inputs.build_ios
    # 同 macos job：macos-14 已退役，macos-15 带 Flutter 3.35.1 可用的 Xcode 16.x。
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 选择 Flutter 3.35.1 支持的 Xcode 16.x
        shell: bash
        run: |
          set -euo pipefail
          # macos-15 当前默认 Xcode 16.4；Flutter 3.35.1 的验证基线是 Xcode 16.x。
          # 镜像未来若把默认值升到 26，这里显式切回已安装的 16.x。
          xcode_version="$(xcodebuild -version)"
          if ! printf '%s\n' "$xcode_version" | grep -q '^Xcode 16\.'; then
            candidate="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1 || true)"
            if [ -z "$candidate" ]; then
              echo "::error::macos-15 上没有 Xcode 16.x；Flutter 3.35.1 未验证 Xcode 26，请先升级 Flutter 或固定镜像。"
              exit 1
            fi
            sudo xcode-select -s "$candidate"
            xcode_version="$(xcodebuild -version)"
          fi
          printf '%s\n' "$xcode_version" | grep -q '^Xcode 16\.' || {
            echo "::error::当前 Xcode 不是 16.x，Flutter 3.35.1 构建未验证。"
            exit 1
          }
          flutter --version
          pod --version

      - name: 计算版本号
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          [ -n "$version" ] || version="0.0.0"
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: 生成 iOS 原生脚手架（仅缺失时）
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org cn.shanghaitech --project-name kedaya --no-pub .
          fi

      - name: 解析依赖（锁定 pubspec.lock）
        run: flutter pub get --enforce-lockfile

      - name: 构建 iOS（不签名）
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=KEDAYA_FLAVOR="$KEDAYA_FLAVOR" \
            --dart-define=KEDAYA_API_BASE_URL="$KEDAYA_API_BASE_URL" \
            --dart-define=KEDAYA_ECARD_BIND_TOKEN="$KEDAYA_ECARD_BIND_TOKEN"

      - name: 打包未签名 Runner.app
        run: |
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          mkdir -p build/artifacts
          ditto -c -k --keepParent "$app" \
            "build/artifacts/kedaya-${VERSION}-ios-unsigned.zip"
          ls -lh build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kedaya-ios-unsigned
          path: apps/mobile/build/artifacts/*.zip
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  # Release：只在 tag 推送或手动 publish_release=true 时运行。
  # 不接收/不打印任何签名密钥；上传的是上面各 job 的未正式签名产物。
  # ------------------------------------------------------------------
  release:
    name: GitHub Release（manual / tag）
    needs:
      - quality
      - android
      - windows-x64
      - linux-x64
      - linux-arm64
      - macos
      - ios
    if: |
      always() && (
        startsWith(github.ref, 'refs/tags/mobile-v') ||
        inputs.publish_release == true
      ) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout 让 gh release create 在 tag 不存在时知道要指向哪个 commit。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kedaya-*
          path: dist
          merge-multiple: true

      - name: 校验并生成 SHA256
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease == false && 'false' || 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::手动发布必须在 workflow_dispatch 里填写 release_tag（例如 mobile-v0.1.0）"
            exit 1
          fi

          # 只根据本次实际下载到的 dist 产物生成说明；未构建的平台不出现。
          shopt -s nullglob
          apks=(dist/*.apk)
          windows_exes=(dist/*.exe)
          windows_zips=(dist/*windows*.zip)
          macos_zips=(dist/*macos*.zip)
          macos_dmgs=(dist/*.dmg)
          ios_zips=(dist/*ios*.zip)

          {
            echo '## Kedaya mobile build'
            echo
            echo 'Automated artifacts from `.github/workflows/mobile-build.yml`.'
            echo
            echo '### Artifacts'
            echo
            find dist -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '- `%f`\n' | sort
            echo
            echo '### Signing status (read before installing)'
            echo
            if [ ${#apks[@]} -gt 0 ]; then
              echo '- Android APK is a **release build signed with the Android debug key**'
              echo '  (`android/app/build.gradle.kts` still points `release` at `signingConfigs.debug`).'
              echo '  It is for internal testing/sideloading only, not Play Store distribution.'
            fi
            if [ ${#windows_exes[@]} -gt 0 ] || [ ${#windows_zips[@]} -gt 0 ]; then
              echo '- Windows installer/portable are **not Authenticode signed**; SmartScreen will warn.'
            fi
            if [ ${#macos_zips[@]} -gt 0 ] || [ ${#macos_dmgs[@]} -gt 0 ]; then
              echo '- macOS app is **ad-hoc signed and not notarized**; Gatekeeper will block it on other Macs.'
            fi
            if [ ${#ios_zips[@]} -gt 0 ]; then
              echo '- iOS artifact is an **unsigned `Runner.app` zip**, not an installable `.ipa`.'
            fi
            echo
            echo '### Notes'
            echo
            echo "- Flutter is pinned to ${FLUTTER_VERSION} (see \`apps/mobile/.metadata\`)."
            echo '- Native platform folders are generated in CI with `flutter create` only when missing;'
            echo '  checked-in `android/` is never overwritten.'
            echo '- Android/iOS/desktop builds use mock adapters unless the repository'
            echo '  variables `KEDAYA_FLAVOR` / `KEDAYA_API_BASE_URL` are configured.'
            echo '- SHA256 checksums are attached as `SHA256SUMS.txt`.'
            echo '- Windows ARM64 and HarmonyOS are not part of this release.'
          } > release-notes.md

          args=(--title "Kedaya mobile $TAG" --notes-file release-notes.md)
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${args[@]}" dist/*
          fi
