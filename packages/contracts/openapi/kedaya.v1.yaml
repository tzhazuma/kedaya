        explanation:
          type: string
          description: 为什么得出这些结论（可解释性要求）
        sourceModules:
          type: array
          items: { type: string }
          description: 数据来源模块白名单，绝不含敏感域
    AiPortraitRequestCreate:
      type: object
      properties:
        refresh: { type: boolean, default: false }

    FaqEntry:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        helpfulCount: { type: integer }
        unhelpfulCount: { type: integer }
        myVote:
          type: [string, 'null']
          enum: [helpful, unhelpful, null]
          description: 当前用户的投票（未投为 null）
    FaqEntryCreate:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 300 }
        answer: { type: string, maxLength: 5000 }
        category: { type: string, maxLength: 60 }

    TechPieLink:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [sso, schedule, assignment, campus-card]
        linked: { type: boolean }
        linkedAt: { type: string, format: date-time }
    TechPieLinkCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [sso, schedule, assignment, campus-card]
        token: { type: string }

    FacilityBooking:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [gym, badminton, basketball, tennis, pool, other]
        facilityName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status:
          type: string
          enum: [requested, confirmed, checked-in, completed, cancelled, no-show]
        feeFen:
          type: integer
          description: 费用，**整数分**（免费为 0）
    FacilityBookingCreate:
      type: object
      required: [kind, startsAt, endsAt]
      properties:
        kind:
          type: string
          enum: [gym, badminton, basketball, tennis, pool, other]
        facilityName: { type: string, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    ForumBoard:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        postCount: { type: integer }

    ForumReply:
      type: object
      required: [id, postId, body, createdAt]
      properties:
        id: { type: string }
        postId: { type: string }
        parentReplyId: { type: [string, 'null'] }
        body: { type: string }
        anonymous: { type: boolean }
        authorDisplay: { type: string }
        createdAt: { type: string, format: date-time }

    FaqCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
        itemCount: { type: integer }

    FaqTicket:
      type: object
      required: [id, question, status, createdAt]
      properties:
        id: { type: string }
        question: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [open, answered, closed]
        answer: { type: string }
        createdAt: { type: string, format: date-time }

    # ---- wildlife：区域 / 观测 / 热点 / 轨迹 / 个体 / 分类 ----
    WildlifeZone:
      type: object
      description: 管理端划定的区域（**不是**观测点）。含投喂规范与模糊半径。
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        speciesIds:
          type: array
          items: { type: string }
        centerLat:
          type: number
          description: WGS84
        centerLng:
          type: number
          description: WGS84
        radiusM: { type: integer }
        feedingPolicy:
          type: string
          enum: [allowed, discouraged, forbidden]
        noticeText:
          type: string
          description: 告示文案（黑天鹅等）；文案需校方审核后方可上线
        fuzzRadiusM:
          type: integer
          description: 该区域的模糊半径（米），默认 50
        isSensitive:
          type: boolean
          description: 敏感区（宿舍/保育/巢区）→ **不输出任何坐标**，只给 zoneId
        sortOrder: { type: integer }

    WildlifeSpecies:
      type: object
      required: [id, scientificName, commonNameZh]
      properties:
        id: { type: string }
        scientificName: { type: string }
        commonNameZh: { type: string }
        commonNameEn: { type: string }
        taxonRank:
          type: string
          enum: [species, genus, family, order]
        parentId: { type: [string, 'null'] }
        isProtected: { type: boolean }
        isNestingSensitive:
          type: boolean
          description: 繁殖期敏感 → 模糊半径季节性放大（规格 §9.4）
        nestingMonths:
          type: array
          items: { type: integer }
        defaultFeedingPolicy:
          type: string
          enum: [allowed, discouraged, forbidden]

    WildlifeIndividual:
      type: object
      description: 被命名的个体（"手动给个名字"）
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        speciesId: { type: string }
        note: { type: string }
        photoMediaId: { type: string }

    WildlifeIndividualCreate:
      type: object
      required: [name, speciesId]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        speciesId: { type: string }
        note: { type: string, maxLength: 500 }
        photoMediaId: { type: string }

    WildlifeSighting:
      type: object
      description: 一条观测上报。坐标字段是**模糊后**的公开坐标。
      required: [id, observedAt, status]
      properties:
        id: { type: string }
        speciesId: { type: [string, 'null'] }
        speciesSource:
          type: string
          enum: [manual, auto, corrected]
          description: 物种是怎么确定的（手动 / 自动分类 / 事后纠正）
        observedAt:
          type: string
          format: date-time
          description: |
            **发现时间**（观察时刻，客户端采集），区别于 `createdAt`（服务端入库时刻）。
            补录与离线同步时两者会相差很久，因此必须分开（契约 §11.10-A）。
        fuzzedGeo:
          type: object
          description: |
            模糊后的公开坐标（WGS84）。**敏感区内该字段为空**，只给 zoneId。
          properties:
            lat: { type: number }
            lng: { type: number }
        zoneId: { type: [string, 'null'] }
        fuzzLevel:
          type: string
          enum: [grid, zone-only, coarsened]
          description: 实际生效的模糊层级（zone-only = 因敏感区或 k<3 而降级）
        mediaIds:
          type: array
          items: { type: string }
          maxItems: 9
        note: { type: string }
        status:
          type: string
          enum: [PENDING, PUBLISHED, REJECTED, WITHDRAWN]
        isInferred: { type: boolean, const: false }
        createdAt: { type: string, format: date-time }

    WildlifeSightingCreate:
      type: object
      required: [observedAt, latitude, longitude]
      properties:
        observedAt:
          type: string
          format: date-time
          description: 发现时间。不得晚于入库时刻 +5 分钟，不得早于 −30 天（契约 §11.10-A）
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: '**WGS84**。小程序地图点选得到的是 GCJ-02，必须先转换。'
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: '**WGS84**'
        speciesId:
          type: [string, 'null']
          description: 用户手动选择的物种（可空，允许"先上传后鉴定"）
        individualId: { type: [string, 'null'] }
        mediaIds:
          type: array
          items: { type: string }
          maxItems: 9
        note: { type: string, maxLength: 500 }

    WildlifeSpot:
      type: object
      description: |
        **聚合热点**（派生只读，由 Worker 生成，延迟 ≥24h）。
        注意它与 `WildlifeZone`（管理端划定）和 `WildlifeSighting`（一次上报）都不同。
      properties:
        id: { type: string }
        speciesId: { type: string }
        zoneId: { type: [string, 'null'] }
        fuzzedGeo:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        sightingCount: { type: integer }
        distinctReporters: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        computedAt: { type: string, format: date-time }

    WildlifeTrack:
      type: object
      description: 推断轨迹（**不是**实测路径）
      properties:
        id: { type: string }
        speciesId: { type: string }
        individualId: { type: [string, 'null'] }
        isInferred:
          type: boolean
          const: true
          description: 恒为 true。由离散观测点推断，客户端必须显著标注。
        points:
          type: array
          items:
            type: object
            properties:
              lat: { type: number }
              lng: { type: number }
              observedAt: { type: string, format: date-time }
        pointCount: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        disclaimer:
          type: string
          description: 服务端下发的免责说明，客户端必须原样展示

    WildlifeClassification:
      type: object
      required: [speciesId, confidence]
      properties:
        speciesId: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        provider: { type: string }
        #
        # 误分类的责任边界见规格 §5.7：自动分类只是**建议**，
        # 最终由用户确认；平台不对自动分类结果作准确性承诺。
        #
        isSuggestion: { type: boolean, const: true }

  responses:
    Unauthenticated:
      description: 未认证（第一级身份缺失或失效）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    ValidationFailed:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    Conflict:
      description: 状态冲突（如拼单已满）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    ConsentRequired:
      description: 需要二次同意（`CONSENT_REQUIRED`，契约 §9）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    CampusBindingRequired:
      description: 需要先绑定校园系统（`CAMPUS_BINDING_REQUIRED`，契约 §5）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    UpstreamUnavailable:
      description: 上游校园系统不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    ModuleList:
      description: 模块资源列表（统一形状）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PageMeta' }
    ModuleCreated:
      description: 模块资源创建成功（统一形状）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiSuccess' }
