# ====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 可达鸭自有 JWT（第一级身份），**不是**任何校园系统的 token

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页指针；不传表示第一页
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；同一键的重复写请求只生效一次
      schema: { type: string }

  schemas:
    # ---------------- 信封 ----------------
    ApiErrorCode:
      type: string
      description: 机器可读错误码（与 packages/contracts/src/envelope.ts 的 ApiErrorCode 联合类型一一对应）
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - CONFLICT
        - CAMPUS_BINDING_REQUIRED
        - CONSENT_REQUIRED
        - UPSTREAM_UNAVAILABLE
        - INTERNAL

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ApiErrorCode' }
        message:
          type: string
          description: 面向用户的中文文案
        details:
          description: 可选结构化细节（字段级校验错误等）

    ApiSuccess:
      type: object
      required: [ok, data, traceId]
      properties:
        ok: { type: boolean, const: true }
        data: {}
        traceId: { type: string }

    ApiFailure:
      type: object
      required: [ok, error, traceId]
      properties:
        ok: { type: boolean, const: false }
        error: { $ref: '#/components/schemas/ApiError' }
        traceId: { type: string }

    ApiEnvelope:
      oneOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - $ref: '#/components/schemas/ApiFailure'

    # ---------------- 身份 ----------------
    User:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        studentId:
          type: string
          description: 学号；仅第一级身份持有
        displayName: { type: string }
        department: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri }

    CampusBindingSummary:
      type: object
      description: |
        校园系统绑定的**摘要**。注意：**不含**任何 cookie / session / tgc —— 
        那些永远留在服务端（契约 §5）。
      required: [platform, bound]
      properties:
        platform:
          type: string
          enum: [egate, cp-daily, academic, campus-card]
        bound: { type: boolean }
        expiresAt: { type: string, format: date-time }
        lastRenewedAt: { type: string, format: date-time }

    # ---------------- 业务实体 ----------------
    GroupbuyOrder:
      type: object
      required: [id, title, status, amountFen, minMembers, memberCount, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [open, full, closed, settled, cancelled]
        amountFen:
          type: integer
          description: 金额，**整数分**
        minMembers: { type: integer, minimum: 2 }
        memberCount: { type: integer }
        deadline: { type: string, format: date-time }
        pickupSpot: { type: string }
        createdAt: { type: string, format: date-time }

    GroupbuyOrderCreate:
      type: object
      required: [title, amountFen, minMembers]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        amountFen: { type: integer, minimum: 0 }
        minMembers: { type: integer, minimum: 2, maximum: 200 }
        deadline: { type: string, format: date-time }
        pickupSpot: { type: string, maxLength: 120 }

    GroupbuyOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GroupbuyOrder' }

    WellbeingAppointment:
      type: object
      required: [id, status, scheduledAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [requested, confirmed, completed, cancelled]
        scheduledAt: { type: string, format: date-time }
        counselorName: { type: string }
        mode:
          type: string
          enum: [in-person, online]
        notes:
          type: string
          description: 加密存储；不进入任何画像

    WellbeingAppointmentCreate:
      type: object
      required: [scheduledAt, mode]
      properties:
        scheduledAt: { type: string, format: date-time }
        mode:
          type: string
          enum: [in-person, online]
        topic: { type: string, maxLength: 500 }

    WellbeingAppointmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WellbeingAppointment' }

    CrisisLine:
      type: object
      required: [module, title, message, hotlines, channels, prominence]
      properties:
        module: { type: string, enum: [wellbeing] }
        title: { type: string }
        message: { type: string }
        prominence:
          type: string
          enum: [primary]
          description: 前端必须**首屏**渲染（禁止折叠进二级菜单）
        requiresLogin: { type: boolean, const: false }
        requiresConsent: { type: boolean, const: false }
        hotlines:
          type: array
          description: 可直接拨打的号码（客户端调 `makePhoneCall`）
          items:
            type: object
            required: [name, number]
            properties:
              name: { type: string }
              number: { type: string }
        channels:
          type: array
          description: 打不了电话时的可执行下一步（辅导员 / 保卫处），绝不只写「请寻求专业帮助」
          items:
            type: object
            required: [name, instruction]
            properties:
              name: { type: string }
              instruction: { type: string }

    ConsentRecord:
      type: object
      required: [module, nameZh, gated, active]
      description: 二次同意记录（privacy / dorm-harmony / ai-portrait / wellbeing 共用同一形状）
      properties:
        module: { type: string }
        nameZh: { type: string }
        summary: { type: string }
        sensitivity: { type: string }
        gated: { type: boolean, description: 契约里该模块是否需要二次同意 }
        active: { type: boolean, description: 当前是否有效授权 }
        version: { type: string, nullable: true }
        grantedAt: { type: string, nullable: true }
        revokedAt: { type: string, nullable: true }

    ForumPost:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        boardId: { type: string }
        title: { type: string }
        body: { type: string }
        anonymous:
          type: boolean
          description: 匿名帖的作者身份与实名身份解耦存储
        authorDisplay: { type: string }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }

    ForumPostCreate:
      type: object
      required: [title, body]
      properties:
        boardId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        anonymous: { type: boolean, default: false }

    ForumPostPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ForumPost' }

    PageMeta:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array }
        nextCursor:
          type: [string, 'null']
        total: { type: integer }

    # ---------------- 其余 15 个模块的实体 ----------------
    ScheduleCourse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        teacher: { type: string }
        location: { type: string }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        startsAt: { type: string }
        endsAt: { type: string }
    ScheduleCourseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        teacher: { type: string, maxLength: 60 }
        location: { type: string, maxLength: 120 }
        weekday: { type: integer, minimum: 1, maximum: 7 }

    CampusCardTxn:
      type: object
      properties:
        id: { type: string }
        amountFen: { type: integer }
        balanceFen: { type: integer }
        merchant: { type: string }
        occurredAt: { type: string, format: date-time }
    CampusCardTxnCreate:
      type: object
      required: [amountFen]
      properties:
        amountFen: { type: integer, minimum: 100 }

    ProfileItem:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        value: { type: string }
    ProfileItemCreate:
      type: object
      required: [key, value]
      properties:
        key: { type: string, maxLength: 60 }
        value: { type: string, maxLength: 500 }

    NotificationItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationCreate:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [in-app, wechat-subscribe, apns, fcm]
        topic: { type: string }

    TakeoutReport:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [submitted, evidence-needed, negotiating, resolved, rejected]
        spot: { type: string }
        occurredAt: { type: string, format: date-time }
        anonymous: { type: boolean }
    TakeoutReportCreate:
      type: object
      required: [spot, occurredAt]
      properties:
        spot: { type: string, maxLength: 120 }
        occurredAt: { type: string, format: date-time }
        description: { type: string, maxLength: 1000 }
        anonymous: { type: boolean, default: true }

    FleaItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        priceFen: { type: integer }
        condition: { type: string }
        status:
          type: string
          enum: [on-sale, reserved, sold, withdrawn]
    FleaItemCreate:
      type: object
      required: [title, priceFen]
      properties:
        title: { type: string, maxLength: 80 }
        priceFen: { type: integer, minimum: 0 }
        condition:
          type: string
          enum: [new, like-new, good, fair, poor]
        description: { type: string, maxLength: 2000 }
        imageUrls:
          type: array
          items: { type: string, format: uri }
          maxItems: 9

    DormHarmonyCase:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [submitted, assigned, mediating, resolved, closed]
        category:
          type: string
          enum: [noise, hygiene, schedule, belongings, other]
        anonymous: { type: boolean }
        createdAt: { type: string, format: date-time }
    DormHarmonyCaseCreate:
      type: object
      required: [category]
      properties:
        category:
          type: string
          enum: [noise, hygiene, schedule, belongings, other]
        description: { type: string, maxLength: 3000 }
        anonymous: { type: boolean, default: true }

    ErrandTask:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        rewardFen: { type: integer }
        status:
          type: string
          enum: [open, accepted, picked-up, delivered, completed, cancelled]
        fromSpot: { type: string }
        toSpot: { type: string }
        deadline: { type: string, format: date-time }
    ErrandTaskCreate:
      type: object
      required: [title, rewardFen, fromSpot, toSpot]
      properties:
        title: { type: string, maxLength: 120 }
        rewardFen: { type: integer, minimum: 0 }
        fromSpot: { type: string, maxLength: 120 }
        toSpot: { type: string, maxLength: 120 }
        deadline: { type: string, format: date-time }

    BuddyPost:
      type: object
      properties:
        id: { type: string }
        activity:
          type: string
          enum: [sports, study, meal, travel, gaming, other]
        title: { type: string }
        capacity: { type: integer }
        joined: { type: integer }
        meetAt: { type: string, format: date-time }
    BuddyPostCreate:
      type: object
      required: [activity, title]
      properties:
        activity:
          type: string
          enum: [sports, study, meal, travel, gaming, other]
        title: { type: string, maxLength: 120 }
        capacity: { type: integer, minimum: 2, maximum: 100 }
        meetAt: { type: string, format: date-time }

    LostFoundItem:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [lost, found]
        title: { type: string }
        spot: { type: string }
        status:
          type: string
          enum: [open, matched, returned, closed]
        occurredAt: { type: string, format: date-time }
    LostFoundItemCreate:
      type: object
      required: [kind, title, spot]
      properties:
        kind:
          type: string
          enum: [lost, found]
        title: { type: string, maxLength: 120 }
        spot: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        occurredAt: { type: string, format: date-time }
        imageUrls:
          type: array
          items: { type: string, format: uri }
          maxItems: 9

    CanteenDish:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        canteen: { type: string }
        priceFen: { type: integer }
        caloriesKcal: { type: integer }
        proteinG: { type: number }
        fatG: { type: number }
        carbG: { type: number }
    CanteenDishCreate:
      type: object
      required: [name, canteen, caloriesKcal]
      properties:
        name: { type: string, maxLength: 80 }
        canteen: { type: string, maxLength: 60 }
        priceFen: { type: integer, minimum: 0 }
        caloriesKcal: { type: integer, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        carbG: { type: number, minimum: 0 }

    AiPortrait:
      type: object
      description: 可解释画像。**不得**引用 wellbeing / dorm-harmony 数据。
      properties:
        id: { type: string }
        generatedAt: { type: string, format: date-time }
        interests:
          type: array
          items: { type: string }
        explanation:
          type: string
          description: 为什么得出这些结论（可解释性要求）
        sourceModules:
          type: array
          items: { type: string }
          description: 数据来源模块白名单，绝不含敏感域
    AiPortraitRequestCreate:
      type: object
      properties:
        refresh: { type: boolean, default: false }

    FaqEntry:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        helpfulCount: { type: integer }
    FaqEntryCreate:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 300 }
        answer: { type: string, maxLength: 5000 }
        category: { type: string, maxLength: 60 }

    TechPieLink:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [sso, schedule, assignment, campus-card]
        linked: { type: boolean }
        linkedAt: { type: string, format: date-time }
    TechPieLinkCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [sso, schedule, assignment, campus-card]
        token: { type: string }

    WildlifeSpot:
      type: object
      properties:
        id: { type: string }
        species:
          type: string
          enum: [cat, bird, black-swan, other]
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        lastSeenAt: { type: string, format: date-time }
        feedingAllowed: { type: boolean }
    WildlifeSpotCreate:
      type: object
      required: [species, latitude, longitude]
      properties:
        species:
          type: string
          enum: [cat, bird, black-swan, other]
        name: { type: string, maxLength: 60 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        note: { type: string, maxLength: 500 }

  responses:
    Unauthenticated:
      description: 未认证（第一级身份缺失或失效）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    ValidationFailed:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    Conflict:
      description: 状态冲突（如拼单已满）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    ConsentRequired:
      description: 需要二次同意（`CONSENT_REQUIRED`，契约 §9）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    CampusBindingRequired:
      description: 需要先绑定校园系统（`CAMPUS_BINDING_REQUIRED`，契约 §5）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiFailure' }
    UpstreamUnavailable:
      description: 上游校园系统不可用
