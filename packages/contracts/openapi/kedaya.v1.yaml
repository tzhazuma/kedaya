        title: { type: string, maxLength: 120 }
        rewardFen: { type: integer, minimum: 0 }
        fromSpot: { type: string, maxLength: 120 }
        toSpot: { type: string, maxLength: 120 }
        deadline: { type: string, format: date-time }

    BuddyPost:
      type: object
      properties:
        id: { type: string }
        activity:
          type: string
          enum: [sports, study, meal, travel, gaming, other]
        title: { type: string }
        capacity: { type: integer }
        joined: { type: integer }
        meetAt: { type: string, format: date-time }
    BuddyPostCreate:
      type: object
      required: [activity, title]
      properties:
        activity:
          type: string
          enum: [sports, study, meal, travel, gaming, other]
        title: { type: string, maxLength: 120 }
        capacity: { type: integer, minimum: 2, maximum: 100 }
        meetAt: { type: string, format: date-time }

    LostFoundItem:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [lost, found]
        title: { type: string }
        spot: { type: string }
        status:
          type: string
          enum: [open, matched, returned, closed]
        occurredAt: { type: string, format: date-time }
    LostFoundItemCreate:
      type: object
      required: [kind, title, spot]
      properties:
        kind:
          type: string
          enum: [lost, found]
        title: { type: string, maxLength: 120 }
        spot: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        occurredAt: { type: string, format: date-time }
        imageUrls:
          type: array
          items: { type: string, format: uri }
          maxItems: 9

    CanteenDish:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        canteen: { type: string }
        priceFen: { type: integer }
        caloriesKcal: { type: integer }
        proteinG: { type: number }
        fatG: { type: number }
        carbG: { type: number }
    CanteenDishCreate:
      type: object
      required: [name, canteen, caloriesKcal]
      properties:
        name: { type: string, maxLength: 80 }
        canteen: { type: string, maxLength: 60 }
        priceFen: { type: integer, minimum: 0 }
        caloriesKcal: { type: integer, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        carbG: { type: number, minimum: 0 }

    AiPortrait:
      type: object
      description: 可解释画像。**不得**引用 wellbeing / dorm-harmony 数据。
      properties:
        id: { type: string }
        generatedAt: { type: string, format: date-time }
        interests:
          type: array
