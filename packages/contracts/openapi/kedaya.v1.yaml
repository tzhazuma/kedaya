openapi: 3.1.0

info:
  title: 可达鸭 API (KedaYa)
  version: 1.0.0
  summary: 上海科技大学统一校园服务平台 —— 三端共享后端契约
  description: |
    # 可达鸭 API v1

    本文件是可达鸭三端（微信小程序 / Flutter 原生 / Web）与后端之间的**唯一接口契约**。

    ## 冻结约定（与 `docs/architecture/00-FROZEN-CONTRACT.md` §6.1 一致）

    - **Base path**：`/api/v1`
    - **认证**：`Authorization: Bearer <accessToken>`
    - **追踪**：请求头 `X-KedaYa-Trace`；响应体 `traceId` 回填
    - **幂等**：写操作支持 `Idempotency-Key` 头
    - **时间**：ISO-8601 UTC 字符串
    - **金额**：**整数分**（`amountFen: 12345` 表示 123.45 元）
    - **列表**：游标分页（`cursor` / `limit`），**不用 offset**

    ## 统一响应信封

    所有响应（含错误）都是 `ApiEnvelope`：
    ```json
    { "ok": true,  "data": { }, "traceId": "..." }
    { "ok": false, "error": { "code": "NOT_FOUND", "message": "拼单不存在" }, "traceId": "..." }
    ```

    ## 统一资源形状

    每个模块的资源遵循同一形状（见各模块 path）：

    ```
    GET    /api/v1/<module>/items          列表（游标分页）
    POST   /api/v1/<module>/items          创建
    GET    /api/v1/<module>/items/{id}     详情
    PATCH  /api/v1/<module>/items/{id}     更新
    DELETE /api/v1/<module>/items/{id}     删除 / 下架
    POST   /api/v1/<module>/items/{id}/<action>   领域动作
    ```

    ## 两级身份

    见 `docs/architecture/00-FROZEN-CONTRACT.md` §5。
    身份（`/auth/*`）与校园系统绑定（`/auth/campus-bindings`）是**两个层级**。
    未绑定时校园系统相关端点返回 `CAMPUS_BINDING_REQUIRED`。

    ## 敏感模块

    `wellbeing` / `dorm-harmony` / `ai-portrait` 需要二次同意，
    未同意时返回 `CONSENT_REQUIRED`。详见 §9。

  contact:
    name: 可达鸭项目
    url: https://github.com/tzhazuma/kedaya
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.kedaya.app/api/v1
    description: 生产
  - url: http://localhost:3000/api/v1
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 身份 —— 上科大统一身份认证与校园系统绑定（两级模型）
  - name: schedule
    description: 课表 —— 学期、课程表、考试
  - name: campus-card
    description: 校园卡 —— 余额、流水、付款码
  - name: profile
    description: 我的 —— 资料、设置、隐私开关
  - name: notifications
    description: 通知 —— 站内信、订阅消息、推送
  - name: groupbuy
    description: 拼单 —— 拼团凑单：发起、参团、成团、结算
  - name: takeout-guard
    description: 偷外卖 —— 外卖被拿错的举报、举证、协商、信用记录
  - name: flea-market
    description: 跳蚤 —— 二手闲置发布、搜索、议价、面交
  - name: dorm-harmony
    description: 宿舍矛盾 —— 匿名调解申请、调解员介入、公约投票（需二次同意）
  - name: errand
    description: 跑腿 —— 代取快递、买饭、送件，悬赏与接单
  - name: buddy
    description: 找搭子 —— 运动、自习、吃饭、出行组队匹配
  - name: lost-found
    description: 失物招领 —— 丢失登记、拾获登记、双向匹配
  - name: canteen
    description: 食堂营养 —— 菜品营养数据、热量估算、饮食建议
  - name: forum
    description: 论坛 —— 版块、主题、回复、举报与治理
  - name: ai-portrait
    description: AI 校园画像 —— 基于行为的画像与推荐，可解释、可关闭（需二次同意）
  - name: wellbeing
    description: 心理治疗 —— 咨询预约、心理测评、危机干预入口（需二次同意）
  - name: faq
    description: 常见问题 —— 知识库与工单式自助答疑
  - name: techpie
    description: TechPie 整合 —— 与 TechPie / GeekPie 体系互联互通
  - name: wildlife
    description: 猫鸟黑天鹅 —— 校园动物活动区域地图、投喂规范与上报
  - name: facility
    description: 场馆预约 —— 体育场馆、健身房等校园场馆的预约与核销

paths:
  # ==================================================================
  # auth —— 两级身份
  # ==================================================================
  /auth/login:
    post:
      tags: [auth]
      summary: 第一级 · 上科大统一身份认证登录
      description: |
        用上科大统一身份认证（CAS / OAuth）的授权码换取**可达鸭自有 JWT**。
        本端点**只**产出身份（`userId` / 学号 / 姓名 / 院系），
        **不产出**任何校园系统 cookie 或 session。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code]
              properties:
                provider:
                  type: string
                  enum: [shanghaitech-cas, shanghaitech-oauth]
                code:
                  type: string
                  description: 授权码
                redirectUri:
                  type: string
                  format: uri
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accessToken, refreshToken, expiresAt, user]
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          expiresAt: { type: string, format: date-time }
                          user: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新自有 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [auth]
      summary: 当前身份（第一级）
      description: 返回身份信息**以及**校园系统绑定状态摘要，但不返回任何 cookie/session。
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, campusBindings]
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          campusBindings:
                            type: array
                            items: { $ref: '#/components/schemas/CampusBindingSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/campus-bindings:
    get:
      tags: [auth]
      summary: 第二级 · 列出校园系统绑定
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CampusBindingSummary' }
    post:
      tags: [auth]
      summary: 第二级 · 绑定校园系统
      description: |
        绑定 eGate / CpDaily / 教务 / 一卡通。绑定成功后后端持有该系统 session，
        **绝不上抛为身份**。客户端永远拿不到 cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, credentials]
              properties:
                platform:
                  type: string
                  enum: [egate, cp-daily, academic, campus-card]
                credentials:
                  type: object
                  description: 各平台不同的凭据形状；服务端加密存储
                  additionalProperties: true
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /auth/campus-bindings/{platform}:
    delete:
      tags: [auth]
      summary: 第二级 · 解绑校园系统
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [egate, cp-daily, academic, campus-card]
      responses:
        '200':
          description: 解绑成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================================================================
  # groupbuy —— 完整资源示例（其余模块同形状）
  # ==================================================================
  /groupbuy/items:
    get:
      tags: [groupbuy]
      summary: 拼单列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, full, closed, settled, cancelled]
      responses:
        '200':
          description: 拼单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GroupbuyOrderPage' }
    post:
      tags: [groupbuy]
      summary: 发起拼单
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupbuyOrderCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GroupbuyOrder' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /groupbuy/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [groupbuy]
      summary: 拼单详情
      responses:
        '200':
          description: 拼单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GroupbuyOrder' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [groupbuy]
      summary: 更新拼单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupbuyOrderCreate' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
    delete:
      tags: [groupbuy]
      summary: 取消拼单
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /groupbuy/items/{id}/join:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [groupbuy]
      summary: 参团（领域动作）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, default: 1 }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 参团成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GroupbuyOrder' }
        '409':
          $ref: '#/components/responses/Conflict'

  # ==================================================================
  # wellbeing —— 敏感模块（二次同意 + 审计 + 危机出口）
  # ==================================================================
  /wellbeing/items:
    get:
      tags: [wellbeing]
      summary: 我的咨询预约
      description: |
        ⚠️ **最高敏感级**。需要二次同意（`CONSENT_REQUIRED`）。
        每次读写都会落审计日志。返回数据不进入任何画像。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 预约列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WellbeingAppointmentPage' }
        '403':
          $ref: '#/components/responses/ConsentRequired'
    post:
      tags: [wellbeing]
      summary: 预约心理咨询
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WellbeingAppointmentCreate' }
      responses:
        '201':
          description: 预约成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WellbeingAppointment' }
        '403':
          $ref: '#/components/responses/ConsentRequired'

  /wellbeing/crisis-resources:
    get:
      tags: [wellbeing]
      summary: 危机干预资源（无需同意，永远可访问）
      description: |
        危机干预热线出口。**故意不要求任何认证或同意** ——
        处于危机中的用户不应该被任何门槛拦住。
      security: []
      responses:
        '200':
          description: 危机资源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CrisisResource' }

  /wellbeing/consent:
    post:
      tags: [wellbeing]
      summary: 授予 / 撤回二次同意
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, granted]
              properties:
                module:
                  type: string
                  enum: [wellbeing, dorm-harmony, ai-portrait]
                granted: { type: boolean }
      responses:
        '200':
          description: 同意状态已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  # ==================================================================
  # forum —— 完整资源示例（含治理）
  # ==================================================================
  /forum/items:
    get:
      tags: [forum]
      summary: 帖子列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: boardId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 帖子列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ForumPostPage' }
    post:
      tags: [forum]
      summary: 发帖（支持匿名）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForumPostCreate' }
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ForumPost' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /forum/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [forum]
      summary: 帖子详情
      responses:
        '200':
          description: 帖子详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ForumPost' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [forum]
      summary: 删除帖子
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /forum/items/{id}/report:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [forum]
      summary: 举报（领域动作）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: |
                    举报理由。canonical 为 `pii`；服务端同时接受 `privacy` 作为别名。
                  enum: [spam, abuse, pii, illegal, other]
                targetType:
                  type: string
                  description: 举报对象类型（主题或回复），缺省为 `post`
                  enum: [post, reply]
                  default: post
                detail: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  # ==================================================================
  # forum 治理与回复（补充：契约必须比实现更完整，否则实现会各自发明）
  # ==================================================================
  /forum/boards:
    get:
      tags: [forum]
      summary: 版块列表
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }
    post:
      tags: [forum]
      summary: 新建版块（版主）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/ModuleCreated' }

  /forum/items/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [forum]
      summary: 回复列表（楼中楼）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }
    post:
      tags: [forum]
      summary: 发表回复
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
                parentReplyId:
                  type: string
                  description: 楼中楼父回复；缺省为顶层回复
                anonymous: { type: boolean, default: false }
      responses:
        '201': { $ref: '#/components/responses/ModuleCreated' }
        '409':
          description: 主题被锁定或已删除，不可回复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiFailure' }

  # ==================================================================
  # faq 投票与工单
  # ==================================================================
  /faq/items/{id}/votes:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [faq]
      summary: 对 FAQ 条目投票（「有用」/「没用」）
      description: |
        **子资源集合的创建**，不是一次性动作 —— 因此可以重复调用，由服务端按
        (entryId, userId) 去重实现**幂等**：同一用户重复投同一值只算一次，改投则覆盖。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  enum: [helpful, unhelpful]
      responses:
        '200':
          description: 投票结果（返回最新计数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          helpfulCount: { type: integer }
                          unhelpfulCount: { type: integer }
                          myVote:
                            type: [string, 'null']
                            enum: [helpful, unhelpful, null]

  /faq/categories:
    get:
      tags: [faq]
      summary: FAQ 分类字典
      description: |
        分类字典由服务端提供（不要在客户端从 `/faq/items` 派生）——
        否则排序、归档分类、计数都会变成客户端逻辑。见契约 §11.11。
      responses:
        '200':
          description: 分类列表（含条目计数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FaqCategory' }

  /faq/tickets:
    get:
      tags: [faq]
      summary: 我的工单
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }
    post:
      tags: [faq]
      summary: 提交工单（自助答疑未命中时）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
