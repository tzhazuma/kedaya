  # ==================================================================
  # wildlife —— 猫/鸟/黑天鹅活动区域与轨迹
  # 规格：docs/features/wildlife-map.md §10
  # ⚠️ 全链路 WGS84；GCJ-02 只在客户端渲染前一刻转换（规格 §3.2）
  # ==================================================================
  /wildlife/basemap:
    get:
      tags: [wildlife]
      summary: 当前底图配置（含仿射标定 / 署名 / 许可）
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }

  /wildlife/species:
    get:
      tags: [wildlife]
      summary: 物种列表（分类树）
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }

  /wildlife/zones:
    get:
      tags: [wildlife]
      summary: 区域列表（含投喂规范与告示文案）
      description: 无需登录（契约 §11.11：`GET` 集合路由不是 action）。
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }

  /wildlife/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [wildlife]
      summary: 区域详情
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wildlife/spots:
    get:
      tags: [wildlife]
      summary: 聚合热点（**派生只读**，延迟 ≥24h）
      description: |
        由 Worker 聚合生成，**没有写端点**。延迟 ≥24h 是隐私设计的一部分：
        近实时的热点会削弱位置模糊化的效果（规格 §6.1）。
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }

  /wildlife/tracks:
    get:
      tags: [wildlife]
      summary: 推断轨迹列表
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }

  /wildlife/tracks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [wildlife]
      summary: 轨迹详情
      description: |
        ⚠️ 返回的 `isInferred` **恒为 true** —— 这是由离散观测点推断的轨迹，
        **不是**实测路径。客户端必须显著标注，不得暗示这是动物真实走过的路线。
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }

  /wildlife/individuals:
    get:
      tags: [wildlife]
      summary: 已命名个体列表
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }
    post:
      tags: [wildlife]
      summary: 创建命名个体（"手动给个名字"）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WildlifeIndividualCreate' }
      responses:
        '201': { $ref: '#/components/responses/ModuleCreated' }

  /wildlife/items:
    get:
      tags: [wildlife]
      summary: 观测记录列表（游标分页，**仅 PUBLISHED**）
      description: 无需登录。返回的坐标**已经过四层模糊化**（规格 §9）。
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: speciesId
          in: query
          schema: { type: string }
        - name: zoneId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ModuleList' }
    post:
      tags: [wildlife]
      summary: 上报观测（**发现时间 + 地点 + 照片 + 物种**）
      description: |
        服务端在此端点内完成：EXIF 剥离 → 四层位置模糊化 → 分类建议（可选）。
        客户端上传的坐标**必须是 WGS84**（从小程序地图点选拿到的是 GCJ-02，须先转换）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WildlifeSightingCreate' }
      responses:
        '201': { $ref: '#/components/responses/ModuleCreated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /wildlife/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [wildlife]
      summary: 观测详情
      security: []
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [wildlife]
      summary: 修正自己的上报（物种纠正，JSON Merge Patch）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                speciesId: { type: string }
                observedAt: { type: string, format: date-time }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }
    delete:
      tags: [wildlife]
      summary: 撤回自己的上报（软删）
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }

  /wildlife/items/{id}/moderate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [wildlife]
      summary: 审核观测（契约 §11.2 冻结 action：`moderate`）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [PUBLISHED, REJECTED]
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/ModuleCreated' }
        '403': { $ref: '#/components/responses/ConsentRequired' }

  /wildlife/media:
    post:
      tags: [wildlife]
      summary: 上传照片（返回 mediaId）
      description: |
        **服务端强制剥离 EXIF**（含 GPS）—— 客户端承诺不算数，服务端必须断言。
        未剥离 GPS 的照片会直接泄漏拍摄点，绕过全部位置模糊化。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201': { $ref: '#/components/responses/ModuleCreated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /wildlife/classify:
    post:
      tags: [wildlife]
      summary: 请求自动分类建议（可选；无能力时返回空）
      description: |
        可插拔分类器。**无 API key 时必须优雅降级为"手动选择物种"**，
        不得返回错误阻塞上报流程（规格 §5.2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: string }
      responses:
        '200':
          description: 分类建议（`suggestions` 可为空数组表示无能力）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          suggestions:
                            type: array
                            items: { $ref: '#/components/schemas/WildlifeClassification' }
                          degraded:
                            type: boolean
                            description: true 表示分类能力不可用，请用户手动选择

# ====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 可达鸭自有 JWT（第一级身份），**不是**任何校园系统的 token

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页指针；不传表示第一页
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；同一键的重复写请求只生效一次
      schema: { type: string }

  schemas:
    # ---------------- 信封 ----------------
    ApiErrorCode:
      type: string
      description: 机器可读错误码（与 packages/contracts/src/envelope.ts 的 ApiErrorCode 联合类型一一对应）
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - CONFLICT
        - CAMPUS_BINDING_REQUIRED
        - CONSENT_REQUIRED
        - UPSTREAM_UNAVAILABLE
        - INTERNAL

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ApiErrorCode' }
        message:
          type: string
          description: 面向用户的中文文案
        details:
          description: 可选结构化细节（字段级校验错误等）

    ApiSuccess:
      type: object
      required: [ok, data, traceId]
      properties:
        ok: { type: boolean, const: true }
        data: {}
        traceId: { type: string }

    ApiFailure:
      type: object
      required: [ok, error, traceId]
      properties:
        ok: { type: boolean, const: false }
        error: { $ref: '#/components/schemas/ApiError' }
        traceId: { type: string }

    ApiEnvelope:
      oneOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - $ref: '#/components/schemas/ApiFailure'

    # ---------------- 身份 ----------------
    User:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        studentId:
          type: string
          description: 学号；仅第一级身份持有
        displayName: { type: string }
        department: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri }

    CampusBindingSummary:
      type: object
      description: |
        校园系统绑定的**摘要**。注意：**不含**任何 cookie / session / tgc —— 
        那些永远留在服务端（契约 §5）。
      required: [platform, bound]
      properties:
        platform:
          type: string
          enum: [egate, cp-daily, academic, campus-card]
        bound: { type: boolean }
        expiresAt: { type: string, format: date-time }
        lastRenewedAt: { type: string, format: date-time }

    # ---------------- 业务实体 ----------------
    GroupbuyOrder:
      type: object
      required: [id, title, status, amountFen, minMembers, memberCount, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [open, full, closed, settled, cancelled]
        amountFen:
          type: integer
          description: 金额，**整数分**
        minMembers: { type: integer, minimum: 2 }
        memberCount: { type: integer }
        deadline: { type: string, format: date-time }
        pickupSpot: { type: string }
        createdAt: { type: string, format: date-time }

    GroupbuyOrderCreate:
      type: object
      required: [title, amountFen, minMembers]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        amountFen: { type: integer, minimum: 0 }
        minMembers: { type: integer, minimum: 2, maximum: 200 }
        deadline: { type: string, format: date-time }
        pickupSpot: { type: string, maxLength: 120 }

    GroupbuyOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GroupbuyOrder' }

    WellbeingAppointment:
      type: object
      required: [id, status, scheduledAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [requested, confirmed, completed, cancelled]
        scheduledAt: { type: string, format: date-time }
        counselorName: { type: string }
        mode:
          type: string
          enum: [in-person, online]
        notes:
          type: string
          description: 加密存储；不进入任何画像

    WellbeingAppointmentCreate:
      type: object
      required: [scheduledAt, mode]
      properties:
        scheduledAt: { type: string, format: date-time }
        mode:
          type: string
          enum: [in-person, online]
        topic: { type: string, maxLength: 500 }

    WellbeingAppointmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WellbeingAppointment' }

    CrisisResource:
      type: object
      required: [name, contact]
      properties:
        name: { type: string }
        contact: { type: string }
        hours: { type: string }
        description: { type: string }

    ForumPost:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id: { type: string }
        boardId: { type: string }
        title: { type: string }
        body: { type: string }
        status:
          type: string
          description: |
            主题状态。**大写**，与 docs/architecture/02-domain-model.md 的冻结枚举一致。
            状态机：DRAFT→PUBLISHED→LOCKED↔PUBLISHED→HIDDEN→PUBLISHED（申诉成功）/DELETED
          enum: [DRAFT, PUBLISHED, LOCKED, HIDDEN, DELETED]
        tags:
          type: array
          items: { type: string }
          maxItems: 5
        anonymous:
          type: boolean
          description: 匿名帖的作者身份与实名身份解耦存储（契约 §9）
        authorDisplay: { type: string }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ForumPostCreate:
      type: object
      required: [title, body]
      properties:
        boardId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        anonymous: { type: boolean, default: false }

    ForumPostPage:
